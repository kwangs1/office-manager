<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar</title>
<link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css' />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.2.1/themes/default/style.min.css" />
<link rel="stylesheet" th:href="@{/css/calendar/calendar.css(v=${#dates.createNow().getTime()})}" />
<link rel="stylesheet" th:href="@{/css/common/calendar/calendar-modal.css(v=${#dates.createNow().getTime()})}" />
<link rel="stylesheet" th:href="@{/css/common/org/dept-user-tree-modal.css(v=${#dates.createNow().getTime()})}" />


<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.2.1/jstree.min.js"></script>
<script th:src="@{/js/common/org/dept-tree.js(v=${#dates.createNow().getTime()})}"></script>
<script th:src="@{/js/common/api.js}"></script>
<script th:src="@{/js/common/dateUtil.js(v=${#dates.createNow().getTime()})}"></script>
<script th:src="@{/js/common/modalEvent.js(v=${#dates.createNow().getTime()})}"></script>
<script th:src="@{/js/calendar/calendarShare.js(v=${#dates.createNow().getTime()})}"></script>
<script th:src="@{/js/calendar/calendar.api.js(v=${#dates.createNow().getTime()})}"></script>
<script th:src="@{/js/calendar/calendar.event.js(v=${#dates.createNow().getTime()})}"></script>
<script th:src="@{/js/calendar/calendar.service.js(v=${#dates.createNow().getTime()})}"></script>
</head>
<body>
	<div class="calendar-container">

		<div class="calendar-sidebar">
			<button type="button" class="btn-add-type" onclick="openMasterSaveModal()">
				+ 새 달력 추가
			</button>

			<div class="type-list-section">
				<h3>내 캘린더 목록</h3>
				<ul class="type-list">
					<th:block th:if="${not #lists.isEmpty(typeList)}">
						<li th:each="type : ${typeList}"><label> <input
								type="checkbox" name="calendarType" th:value="${type.typeCode}"
								checked> <span class="color-badge"
								th:style="'background-color: ' + ${type.color}"></span> <span
								th:text="${type.typeName}">타입명</span>
						</label></li>
					</th:block>
					<th:block th:unless="${not #lists.isEmpty(typeList)}">
						<li><label> <input type="checkbox"
								name="calendarType" value="1" checked> <span
								class="color-badge" style="background-color: #3b82f6;"></span>
								전사 일정
						</label></li>
						<li><label> <input type="checkbox"
								name="calendarType" value="2" checked> <span
								class="color-badge" style="background-color: #2ecc71;"></span>
								개인 일정
						</label></li>
					</th:block>
				</ul>
			</div>

			<form th:action="@{/api/sign-out}" method="POST" class="logout-section">
				<button type="submit" class="btn-logout">
					<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
					        <polyline points="16 17 21 12 16 7"></polyline>
					        <line x1="21" y1="12" x2="9" y2="12"></line>
    				</svg> 로그아웃
				</button>
			</form>
		</div>

		<div class="calendar-main">
			<div id="calendar"></div>
		</div>
	</div>

	<div id="calendarTooltip" class="fc-tooltip"></div>

	<div th:replace="~{modal/eventSaveModal :: eventSaveModal}"></div>
	<div th:replace="~{modal/eventDetailModal :: eventDetailModal}"></div>
	<div th:replace="~{modal/masterSaveModal :: masterSaveModal}"></div>
	<div th:replace="~{modal/deptTreeModal :: deptTreeModal}"></div>

<script th:inline="javascript">
$(document).on('click', '.user-chk', function() {
    CalendarShare.toggleUser(
        $(this).attr('data-id'), 
        $(this).attr('data-nm'), 
        $(this).is(':checked')
    );
});

// 전체 선택
$(document).on('click', '#checkAllUsers', function() {
    const isChecked = $(this).is(':checked');
    $('.user-chk').prop('checked', isChecked);
    
    $('.user-chk').each(function() {
        CalendarShare.toggleUser($(this).attr('data-id'), $(this).attr('data-nm'), isChecked);
    });
});

/*<![CDATA[*/
var loginUserId = /*[[${session.loginUserId}]]*/ 'default';
var logindeptId = /*[[${session.loginDeptId}]]*/ 'default';
/*]]>*/
</script>
</body>
</html>
